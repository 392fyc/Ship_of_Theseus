context:
  problem: |
    P1 demo has basic attack/skill execution but no action resource system.
    Every unit can use all skills freely each turn without resource constraints.
    This eliminates the core tactical choice of "what to do with limited resources per turn".
  design_source: |
    GDD Section 1 (Turn System) defines a BG3-inspired action economy:
    - Movement: move attribute, consumed by normal move OR [Move Action] skill
    - Attack Opportunity: 1/turn, consumed by normal attack OR [Standard Action] skill
    - Swift Action: 1/turn, [Swift Action] skill, independent resource
    - Reaction: conditional trigger, not a per-turn resource
    - Free: no cost, unlimited

    GDD Section 4 (Skills) defines:
    - action_cost field: "move"|"standard"|"swift"|"reaction"|"free"
    - timing_constraint: "any"|"before_move"|"after_move"|"before_attack"|"after_attack"
    - cooldown: int (wait N turns after use before reuse)
  current_state: |
    - turn_manager.gd handles turn order and basic turn flow
    - game_action.gd processes GameAction commands
    - tactical_scene.gd manages battle scene and unit selection
    - 15 skill JSONs exist but lack action_cost and timing_constraint fields
    - No cooldown tracking exists

design_spec: |
  ## Action Resource Model

  Each unit tracks per-turn resource state:
  - movement_used: bool (consumed by normal move or Move Action skill)
  - standard_used: bool (consumed by normal attack or Standard Action skill)
  - swift_used: bool (consumed by Swift Action skill, 1/turn)
  - reaction_available: bool (reset each turn, consumed by Reaction trigger)

  Resources reset at unit turn start. Order within a turn:
  1. Turn start (resources reset, buff ticks)
  2. Player actions (move, attack, skills - consuming resources)
  3. Turn end (cooldown decrement, buff duration decrement)

  ## Action Cost Validation

  Before executing any skill, game_action must validate:
  - action_cost == "move" -> movement_used must be false
  - action_cost == "standard" -> standard_used must be false
  - action_cost == "swift" -> swift_used must be false
  - action_cost == "reaction" -> reaction_available must be true AND trigger condition met
  - action_cost == "free" -> always allowed

  Normal move consumes movement resource (movement_used = true).
  Normal attack consumes standard resource (standard_used = true).
  Using a Move Action skill prevents normal move and vice versa.
  Using a Standard Action skill prevents normal attack and vice versa.

  ## Timing Constraint

  timing_constraint restricts WHEN a skill can be used within a turn:
  - "any": no restriction (default)
  - "before_move": only usable if movement_used == false (before moving)
  - "after_move": only usable if movement_used == true (after moving)
  - "before_attack": only usable if standard_used == false
  - "after_attack": only usable if standard_used == true

  ## Cooldown System

  Per-unit per-skill cooldown tracker (Dictionary: skill_id -> remaining_turns).
  - On skill use: set cooldown[skill_id] = skill.cooldown
  - On turn end: decrement all cooldowns by 1, remove when reaching 0
  - Skill with cooldown > 0 is unavailable (greyed in UI)

  ## Skill Panel UI

  Display all available skills for the selected unit:
  - Each skill shows: name, action_cost icon, cooldown state
  - Greyed out if: resource already consumed, or on cooldown, or timing_constraint not met
  - Tooltip or label shows reason for unavailability
  - Clicking an available skill enters targeting mode (existing flow)

  ## Skill JSON Updates

  All 15 existing skill JSONs must be updated to include:
  - "action_cost": appropriate value based on skill design
  - "timing_constraint": "any" for most, specific constraints where design requires
  - Existing "cooldown" field already present in JSON schema, verify it is read and used

  Proposed action_cost assignments (from GDD class/skill design):

  Soldier:
  - soldier_slash: "standard" (basic melee attack)
  - soldier_shield_bash: "standard" (melee stun)
  - soldier_rally: "swift" (team buff)

  Archer:
  - archer_aimed_shot: "standard" (ranged attack)
  - archer_piercing_arrow: "standard" (armor-piercing ranged)
  - archer_eagle_eye: "swift" (accuracy buff)

  Mage:
  - mage_fireball: "standard" (AoE magic)
  - mage_ice_bolt: "standard" (ranged + slow)
  - mage_mana_shield: "swift" (self defense buff)

  Knight:
  - knight_heavy_strike: "standard" (high damage melee)
  - knight_charge: "move" (displacement + attack)
  - knight_iron_wall: "swift" (defense stance)

  Cleric:
  - cleric_heal: "standard" (single target heal)
  - cleric_holy_smite: "standard" (holy damage)
  - cleric_bless: "swift" (ally buff)

definition_of_done:
  - "Per-unit per-turn action resources tracked and reset correctly"
  - "game_action validates action_cost before skill execution, blocks if resource spent"
  - "Normal move and Move Action skills are mutually exclusive within a turn"
  - "Normal attack and Standard Action skills are mutually exclusive within a turn"
  - "Swift Action limited to 1 per turn, does not consume move or attack"
  - "timing_constraint enforced: before_move/after_move/before_attack/after_attack"
  - "Per-unit per-skill cooldown tracked, decremented at turn end"
  - "Skill Panel UI shows all skills with cost type, cooldown state, greyed unavailable"
  - "All 15 skill JSONs updated with action_cost and timing_constraint"
  - "No hardcoded values - all parameters read from JSON"

required_evidence:
  - "Code references for resource tracking in turn_manager or unit"
  - "Code references for action_cost validation in game_action"
  - "Code references for cooldown tracking and decrement"
  - "Screenshot or description of Skill Panel UI showing available/unavailable skills"
  - "At least one skill JSON diff showing added fields"

