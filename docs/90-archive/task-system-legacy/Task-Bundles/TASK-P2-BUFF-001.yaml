context:
  problem: |
    The game currently has no buff/debuff system. ADR-002 designed the BuffEffect Resource
    structure but it has not been implemented. Skills that should apply effects (e.g., burn,
    slow) have no runtime support. The turn system has timing hooks (turn_start, turn_end)
    but no buff tick/expiry logic. No visual feedback exists for active status effects on units.
  design_source: |
    ADR-002 (Buff/Debuff Data Structure) defines:

    BuffEffect Resource fields:
    - buff_id, display_name, icon
    - duration, max_duration
    - effect_type: stat_mod | dot | hot | shield | control | special
    - stat_key, value, is_percentage
    - trigger: turn_start | turn_end | on_hit | on_attacked | permanent
    - source_unit_id
    - stackable, max_stacks, refresh_on_reapply

    Stacking rules:
    - Override (burn): stackable=false, refresh=true → refresh duration
    - Stacking (sharp_wound): stackable=true → add instances up to max_stacks
    - Unique (silence): stackable=false, refresh=false → ignore if exists
    - Independent (shield): stackable=true → coexist from different sources

    Unit interface: add_buff(), remove_buff(), get_buff(), has_buff(), count_buff_stacks()
    TurnManager: on_unit_turn_start() ticks effects, on_unit_turn_end() decrements duration

    battle-calculation.md Debuff application formula:
    actual_chance = skill_effect.chance * max(0.1, 1 - target.LCK / 100)

    turn-system.md timing:
    - Effect trigger = Unit Turn Start
    - Duration decrement = Unit Turn End
    - Application = immediate (stats affected as soon as the buff is applied)

  current_state: |
    - ADR-002 accepted but not implemented (no BuffEffect class exists)
    - turn_manager.gd has turn start/end hooks but no buff iteration
    - damage_calculator.gd has no on-hit effect application
    - Unit script has no buff array or buff management methods
    - No status effect JSON data files exist
    - No status icon UI exists above units
    - Some skill JSONs reference effects but they are not processed at runtime

design_spec: |
  ## BuffEffect Resource Class

  Implement the BuffEffect Resource class exactly as specified in ADR-002:
  - All fields from the ADR spec (buff_id, duration, effect_type, value, etc.)
  - Methods: tick() for turn-based processing, apply()/unapply() for stat modifications
  - Serialization support via to_dict()/from_dict()

  ## Unit Buff Management

  Add buff management to the Unit class following ADR-002 interface:
  - buffs: Array[BuffEffect]
  - add_buff(buff): stacking rules (override/stack/unique/independent)
  - remove_buff(buff): unapply stat mods on removal
  - get_buff(id), has_buff(id), count_buff_stacks(id)
  - _apply_immediate(buff): apply stat_mod effects immediately on add
  - _unapply(buff): reverse stat_mod effects on removal

  ## Effect Lifecycle Integration

  Wire buff lifecycle into TurnManager:
  1. Unit Turn Start: iterate buffs, execute turn_start triggers (DOT damage, HOT healing)
  2. Unit Action Phase: normal gameplay
  3. Unit Turn End: decrement all buff durations, remove expired buffs

  ## 9 Core Status Effects

  Implement as JSON-driven buff definitions (data/buffs/):

  | Effect | Type | Duration | Trigger | Behavior |
  |--------|------|----------|---------|----------|
  | burn | dot | 3 turns | turn_start | Fire damage each turn (value from JSON) |
  | poison | dot | 4 turns | turn_start | Damage ignoring defense each turn |
  | slow | stat_mod | 2 turns | permanent | SPD reduced (affects turn order) |
  | haste | stat_mod | 2 turns | permanent | SPD increased (affects turn order) |
  | stun | control | 1 turn | turn_start | Skip entire turn, removed after skip |
  | freeze | control | 2 turns | turn_start | Skip turn; removed when attacked |
  | defense_up | stat_mod | 3 turns | permanent | DEF increased |
  | defense_down | stat_mod | 3 turns | permanent | DEF decreased |
  | priority_up | stat_mod | 2 turns | permanent | SPD greatly increased for turn order |

  Special rules:
  - Stun: at turn start, check if stunned → skip entire turn
  - Freeze: at turn start, check if frozen → skip turn; when unit is attacked, remove freeze
  - Burn stacking: default same-type refreshes duration (no value stack);
    burn exception for talent-unlockable layers is a FUTURE extension (not in this task)

  ## Debuff Application in Combat

  After damage is dealt (step 5 in attack resolution: Post-Hit Effects):
  - Check skill JSON for effect data (effect_id, chance)
  - Calculate actual_chance = skill_effect.chance * max(0.1, 1 - target.LCK / 100)
  - Roll against actual_chance; on success, create and apply BuffEffect to target
  - Integrate into damage_calculator.gd or game_action.gd as appropriate

  ## Skill JSON Effect Data

  Add effect fields to relevant skill JSONs:
  ```json
  {
    "effects": [
      {
        "effect_id": "burn",
        "chance": 30,
        "duration": 3,
        "value": 10
      }
    ]
  }
  ```

  Ensure at least 3-4 existing skills have effects added:
  - mage_fireball: burn (30%, 3 turns, 10 damage)
  - mage_ice_bolt: freeze (25%, 2 turns) or slow (40%, 2 turns)
  - cleric_bless: defense_up (100%, 3 turns, +3 DEF)
  - soldier_rally: haste (100%, 2 turns, +2 SPD)

  ## Status Icon UI

  Display active buff/debuff icons above each unit on the tactical grid:
  - Small icon row above the unit sprite
  - Each icon shows the effect type (use colored rectangles if no art assets)
  - Remaining turn count displayed on or near each icon
  - Buffs (positive) and debuffs (negative) visually distinguished (e.g., green vs red tint)
  - Icons update in real-time as effects are added/removed/tick

  ## Stat Modifier Integration

  When stat_mod buffs are active, unit stat queries must reflect modifications:
  - Option A: modify base stats directly on apply, reverse on remove
  - Option B: compute effective stats dynamically (base + sum of active modifiers)
  - Prefer Option B for correctness (avoids ordering bugs with multiple buffs)
  - Ensure damage_calculator uses effective stats, not raw base stats

definition_of_done:
  - "BuffEffect Resource class implemented per ADR-002 spec"
  - "Unit buff management (add/remove/get/has/count) working with stacking rules"
  - "Effect lifecycle: apply immediate → tick at turn start → decrement at turn end → expire"
  - "Burn (30%, 3t, 10dmg) applies at correct probability, ticks each turn start, expires after 3 turns"
  - "Poison DOT damages unit each turn, ignoring defense"
  - "Stun causes unit to skip entire turn"
  - "Freeze causes unit to skip turn; removed when attacked"
  - "Slow reduces SPD and affects turn ordering"
  - "Haste increases SPD and affects turn ordering"
  - "defense_up and defense_down modify DEF correctly"
  - "priority_up modifies SPD for turn order"
  - "Debuff application formula: chance * max(0.1, 1 - LCK/100)"
  - "At least 3 skill JSONs updated with effect data"
  - "Status icon UI shows effect icons above units with remaining turns"
  - "No hardcoded values - all effect parameters from JSON"

required_evidence:
  - "Code references for BuffEffect Resource class"
  - "Code references for Unit buff management methods"
  - "Code references for TurnManager buff lifecycle integration"
  - "Code references for debuff application formula"
  - "At least 2 skill JSON diffs showing effect data"
  - "Screenshot or description of status icon UI"

