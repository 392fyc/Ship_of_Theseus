dispatch_id: "DISPATCH-{date}-{nnn}"
task_bundle_id: "TASK-P<phase>-<track>-<nnn>"

objective: "<one-sentence description of what the sub-agent must accomplish>"

agent: "<cursor|codex|antigravity>"
model: "<claude-opus-4.6|gpt-5.4|gpt-5.3-codex|gemini-3.1-pro>"

read_set:
  required:
    - "<file or doc the agent MUST read before starting>"
  optional:
    - "<supplementary context, read only if needed>"

write_scope:
  code_paths:
    - "<repo-relative paths the agent may modify>"
  kb_paths:
    - "<KB-relative paths the agent may modify>"

expected_artifacts:
  - type: "<code|config|skill|doc>"
    path: "<where the artifact should be created>"
    description: "<what it should contain>"

checkpoint_cadence: "on_block"
# on_block: checkpoint before any blocking operation (permission, long research, handoff)
# every_step: checkpoint after each logical step (high overhead, use for fragile tasks)
# on_complete: checkpoint only at task completion (low overhead, no mid-task resume)

completion_receipt:
  format: "implementation_receipt field in task bundle"
  fields_required:
    - "implementer"
    - "branch"
    - "summary"
    - "changed_files"
    - "evidence"
    - "completed_at"

resume_semantics:
  supports_resume: true
  checkpoint_path: "03-AI-Context/Active-Context/checkpoint.json"
  resume_instruction: >
    If resuming from a checkpoint, read checkpoint.json first.
    The resume_context field contains a self-contained paragraph
    describing what was done and what to do next. Do NOT re-read
    chat history; rely on the checkpoint artifact.
