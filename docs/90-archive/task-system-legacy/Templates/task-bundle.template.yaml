task_id: "TASK-P<phase>-<track>-<nnn>"
title: "<short-task-title>"
phase_id: "P<phase>"
milestone_refs: []
adr_refs: []
owner_agent_type: "dev_sub_agent"
priority: "Sev-1"
status: "drafted"
example_artifact: false

code_scope:
  include: []
  exclude: []

read_scope:
  required_docs: []
  optional_docs: []

allowed_write_scope:
  code_paths: []
  kb_paths:
    - "<this-task-bundle-file>"

docs_must_update: []
docs_must_not_touch:
  - "02-Development/Task-Registry/"
  - "03-AI-Context/Active-Context/current-session.md"
  - "02-Development/Acceptance-Bundles/"
  - "02-Development/Issue-Bundles/"

definition_of_done:
  - "<implementation outcome>"
  - "<runtime or static expectation>"

required_evidence:
  - "<code references>"
  - "<tests, logs, screenshots, or runtime proof>"

handoff_to_acceptance:
  acceptance_bundle_id: "ACC-P<phase>-<track>-<nnn>"
  trigger_status: "implementation_done"
  handoff_owner: "main_agent"
  blind_input_policy:
    allowed:
      - "Task Bundle input fields"
      - "Task Bundle referenced docs"
      - "Codebase"
      - "Runtime environment"
    forbidden:
      - "Dev-agent narrative outside this bundle"
      - "Registry mutation by acceptance agent"
  acceptance_focus:
    - "<blind acceptance check 1>"
    - "<blind acceptance check 2>"

implementation_receipt:
  implementer: null
  branch: null
  summary: []
  changed_files: []
  evidence: []
  docs_updated: []
  residual_risks: []
  completed_at: null
