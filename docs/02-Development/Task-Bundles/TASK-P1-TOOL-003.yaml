design_spec: |
  Current Dashboard.md is a static Markdown page with Dataview queries.
  The structured YAML data in registries and bundles enables richer visualization.

  Requirements:
  1. Phase progress overview — milestone completion as visual indicators (progress bar or checklist with counts).
  2. Task summary — recent completed tasks with status, agent, and date.
  3. Issue summary — open/resolved/archived issues with priority badges.
  4. Active session snapshot — current phase, active tasks, blockers.
  5. Must render correctly in Obsidian (Dataview, Dataview JS, or inline HTML/CSS).
  6. Data source is the YAML files — do not hardcode status values.

  Constraints:
  - Obsidian community plugins available: Dataview.
  - Dashboard must remain a single .md file in 00-Index/.
  - Prefer Dataview JS (dataviewjs) blocks for complex rendering.
  - Fallback to inline HTML/CSS if Dataview cannot parse YAML natively.

definition_of_done:
  - "Dashboard.md renders milestone progress as visual indicators from registry YAML"
  - "Recent completed tasks are listed with status, agent, and date"
  - "Open and resolved issues are visible with priority"
  - "Active session info shown at a glance"
  - "Renders correctly in Obsidian without manual refresh"

required_evidence:
  - "Screenshot or description of rendered dashboard in Obsidian"

