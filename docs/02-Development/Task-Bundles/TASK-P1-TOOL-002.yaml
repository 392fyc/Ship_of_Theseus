context:
  problem: "When two MCP-enabled hosts (Cursor + Codex CLI) run simultaneously, each spawns its own godot-mcp node process. Both processes auto-reconnect on disconnect, creating an infinite takeover loop (close code 4002 ping-pong) that makes the MCP connection unusable for either agent."
  root_cause_hypothesis: "The @satelliteoflove/godot-mcp client likely has aggressive auto-reconnect on WebSocket close. When server sends 4002 (takeover), the displaced client immediately reconnects, displacing the new client, which then also reconnects."
  prior_work: "TASK-P1-TOOL-001 resolved the server-side single-client lock with graceful takeover. Server behavior is correct. The problem is now entirely client-side."
  client_architecture:
    package: "@satelliteoflove/godot-mcp@2.16.0"
    entry: "dist/cli.js"
    connection: "dist/connection/websocket.js"
    cache_path: "%LOCALAPPDATA%/npm-cache/_npx/088d4de5374d4e70/"
    spawn_method: "npx @satelliteoflove/godot-mcp (stdio MCP server, host spawns per session)"

investigation_steps:
  - "Read dist/connection/websocket.js to map the reconnection logic: when does it reconnect, what close codes trigger it, is there backoff, is there a kill switch."
  - "Read dist/cli.js and dist/index.js to understand the startup lifecycle: does it connect eagerly on process start, or lazily on first tool call?"
  - "Check the upstream repo (GitHub) for existing configuration options, environment variables, or CLI flags that control reconnection behavior."
  - "Evaluate the following solution candidates and choose the most viable:"

proposed_solutions:
  - id: "SOL-1"
    title: "Upstream config or env var"
    description: "If the package already supports a reconnect disable, backoff config, or lazy-connect flag, use it in .mcp.json env."
    effort: "minimal"
  - id: "SOL-2"
    title: "Server-side close code differentiation"
    description: "Have the addon send a distinct close code (e.g. 4010 DO_NOT_RECONNECT) that the client can respect. Requires both server and client awareness."
    effort: "medium (addon + client must agree on semantics)"
  - id: "SOL-3"
    title: "Server-side reconnect throttle"
    description: "After a takeover, the addon rejects new connections for N seconds, giving the winning client time to stabilize."
    effort: "low-medium (addon-only change)"
  - id: "SOL-4"
    title: "Fork or wrapper with lazy connect + explicit lifecycle"
    description: "Create a thin wrapper or fork that delays WebSocket connection until first tool invocation and does not auto-reconnect on 4002."
    effort: "medium-high (maintenance of fork)"

definition_of_done:
  - "When Cursor and Codex CLI are both running with Godot MCP configured, starting a tool call on one host establishes a stable connection without triggering an infinite takeover loop from the other."
  - "An idle host does not compete for the MCP connection."
  - "Existing single-host MCP workflows remain functional."

required_evidence:
  - "Analysis of the upstream reconnect logic with specific code references."
  - "Description of chosen solution with rationale for rejecting alternatives."
  - "Runtime evidence: two hosts running simultaneously, one executes MCP tools successfully, the other does not create a reconnect storm."

