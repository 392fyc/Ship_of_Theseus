task_id: "TASK-P1-ARCH-001"
title: "Checkpoint and handoff protocol design"
phase_id: "P1"
milestone_refs: []
adr_refs: ["ADR-007"]
owner_agent_type: "main_agent"
priority: "Sev-1"
status: "closed"
example_artifact: false

context:
  research_source: "03-AI-Context/Research/harness-engineering-survey.md"
  axis_coverage: ["AXIS-1", "AXIS-2", "AXIS-3"]
  rationale: >
    Harness Engineering survey identified state shape as the main gap.
    Current state is human-readable MD/YAML but not optimized for
    machine checkpointing and low-cost sub-agent resumption.

code_scope:
  include: []
  exclude: []

read_scope:
  required_docs:
    - "03-AI-Context/Research/harness-engineering-survey.md"
    - "02-Development/Templates/task-bundle.template.yaml"
    - "02-Development/Task-Registry/acceptance-workflow.md"
  optional_docs:
    - "03-AI-Context/Handoffs/git-sync-procedure.md"

allowed_write_scope:
  code_paths: []
  kb_paths:
    - "02-Development/Task-Bundles/TASK-P1-ARCH-001.yaml"
    - "02-Development/Templates/"
    - "03-AI-Context/Active-Context/"

docs_must_update:
  - "02-Development/Templates/checkpoint.schema.json"
  - "02-Development/Templates/handoff-packet.template.yaml"

docs_must_not_touch:
  - "02-Development/Task-Registry/"
  - "02-Development/Acceptance-Bundles/"
  - "02-Development/Issue-Bundles/"

definition_of_done:
  - "checkpoint.schema.json created with documented field semantics"
  - "handoff-packet.template.yaml created with dispatch, scope, and resume fields"
  - "checkpoint.json instantiated at Active-Context with empty initial state"

required_evidence:
  - "Schema files exist and are valid JSON/YAML"
  - "Fields cover: run_id, task_id, agent, status, progress, scope, resume_context"
  - "Handoff template covers: objective, read_set, write_scope, checkpoint_cadence, completion_receipt"

handoff_to_acceptance:
  acceptance_bundle_id: "ACC-P1-ARCH-001"
  trigger_status: "implementation_done"
  handoff_owner: "main_agent"
  blind_input_policy:
    allowed:
      - "Task Bundle input fields"
      - "Task Bundle referenced docs"
      - "Created template files"
    forbidden:
      - "Dev-agent narrative outside this bundle"
      - "Registry mutation by acceptance agent"
  acceptance_focus:
    - "CHK-001: checkpoint.schema.json is valid JSON with all required fields"
    - "CHK-002: handoff-packet template covers dispatch, scope, checkpoint, and resume"
    - "CHK-003: checkpoint.json at Active-Context is instantiated and parseable"

implementation_receipt:
  implementer: "claude-code (Main Agent)"
  branch: null
  summary:
    - "Designed checkpoint.schema.json with sot-checkpoint-v1 schema covering run_id, task_id, agent, status, timestamps, progress, scope, resume_context, and handoff fields"
    - "Created handoff-packet.template.yaml with dispatch_id, objective, agent, model, read_set, write_scope, expected_artifacts, checkpoint_cadence, completion_receipt, and resume_semantics"
    - "Instantiated initial checkpoint.json at Active-Context with current session state"
  changed_files:
    - "02-Development/Templates/checkpoint.schema.json (NEW)"
    - "02-Development/Templates/handoff-packet.template.yaml (NEW)"
    - "03-AI-Context/Active-Context/checkpoint.json (NEW)"
  evidence:
    - "checkpoint.schema.json: valid JSON, 80+ lines, covers all required fields (run_id, task_id, agent, status, progress.last_completed_step, progress.next_step, scope.read_set, scope.write_scope, resume_context)"
    - "handoff-packet.template.yaml: covers objective, read_set, write_scope, checkpoint_cadence (on_block/every_step/on_complete), completion_receipt, resume_semantics"
    - "checkpoint.json: valid parseable JSON instance at Active-Context path"
  docs_updated:
    - "02-Development/Templates/checkpoint.schema.json"
    - "02-Development/Templates/handoff-packet.template.yaml"
  residual_risks:
    - "Schema is v1 design, may need iteration after first real dispatch cycle uses it"
    - "Session skills not yet updated to auto-write checkpoint.json (deferred to ARCH-002 or future task)"
  completed_at: "2026-03-10"
