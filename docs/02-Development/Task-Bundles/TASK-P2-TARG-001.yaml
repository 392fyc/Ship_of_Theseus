  - "Code references for AreaCalculator with all 5 pattern types"
  - "Code references for LOS calculation"
  - "Screenshot or description of range highlight UI"
  - "Screenshot or description of area preview UI"
  - "At least 3 skill JSON diffs showing diversified range/area patterns"

