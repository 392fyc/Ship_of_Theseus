context:
  problem: |
    P1 demo and M8 implementation use only basic diamond range (min=1, max=1 for melee,
    min=1 max=3 for ranged). All skills share the same simple targeting: click a unit in range.
    The GDD defines 5 range pattern types and 5 area pattern types, none of which are
    implemented as a general-purpose engine. No visual feedback exists for range highlighting
    or area preview.
  design_source: |
    GDD Section 4 (Skills and Range) defines:

    Range Patterns (how far can the skill target):
    - diamond: Manhattan distance, most common
    - line: choose one of four cardinal directions
    - cross: all four cardinal directions simultaneously
    - square: Chebyshev distance (8-directional)
    - self: caster position only

    Area Patterns (how large an area around the hit point):
    - single: only the target cell
    - diamond(N): target + N-radius Manhattan area
    - line(N): N cells extending from cast direction
    - cross(N): four directions from target, N cells each
    - square(N): (2N+1)x(2N+1) square centered on target

    min_range support: when min_range > 0, cells closer than min_range are excluded
    (hollow range ring).

    Line of sight: Peak terrain blocks attack line (existing terrain system has
    height data, but no LOS calculation).
  current_state: |
    - game_action.gd has basic range check (Manhattan distance only)
    - tactical_scene.gd handles unit selection and basic targeting flow
    - 15 skill JSONs have range/area fields but all use diamond/single patterns
    - Grid system exists with cell coordinates and terrain data
    - No range highlight visualization exists
    - No area preview visualization exists
    - No line-of-sight calculation exists

design_spec: |
  ## Range Pattern Engine

  Create a reusable RangeCalculator utility that computes valid target cells given:
  - origin: Vector2i (caster position)
  - pattern: RangePattern {type, min_range, max_range}
  - constraints: terrain/LOS blocking

  For each pattern type:
  - diamond: cells where manhattan_distance(origin, cell) >= min_range AND <= max_range
  - line: cells along ONE chosen cardinal direction, distance >= min AND <= max
  - cross: cells along ALL FOUR cardinal directions, distance >= min AND <= max
  - square: cells where chebyshev_distance(origin, cell) >= min AND <= max
  - self: only the origin cell (min=0, max=0)

  The engine must return an Array of Vector2i representing valid targetable cells.

  ## Area Pattern Engine

  Create a reusable AreaCalculator utility that computes affected cells given:
  - target: Vector2i (selected target cell)
  - pattern: AreaPattern {type, size}
  - direction: Vector2i (for line-type areas, the cast direction)

  For each pattern type:
  - single: only the target cell
  - diamond(size): cells where manhattan_distance(target, cell) <= size
  - line(size): cells extending from target in cast direction, up to size cells
  - cross(size): cells extending from target in all 4 cardinal directions, up to size cells
  - square(size): cells where chebyshev_distance(target, cell) <= size

  The engine must return an Array of Vector2i representing affected cells.

  ## Targeting UI Flow

  When a skill is selected from the skill panel:
  1. Compute valid range cells using RangeCalculator
  2. Highlight valid range cells on the grid (blue/cyan tint overlay)
  3. On hover over a valid cell: compute area cells using AreaCalculator
  4. Show area preview overlay (red/orange tint) on affected cells
  5. On click: confirm target, pass target + affected cells to game_action
  6. On right-click or cancel: exit targeting mode

  For line-type ranges: player must choose a direction first (4-directional selector),
  then see the line highlighted in that direction.

  For self-type ranges: skip target selection, auto-target caster position.

  ## Line of Sight

  Peak terrain (height >= threshold from terrain JSON) blocks attack lines.
  Use Bresenham line algorithm or similar to check LOS from caster to target.
  If any intervening cell is Peak terrain, the target cell is excluded from valid range.
  LOS check applies to all non-self range patterns.

  ## Skill JSON Diversification

  Update existing 15 skill JSONs to use varied patterns (not all diamond/single):
  - knight_charge: range line 1-3 (charge in one direction)
  - mage_fireball: range diamond 2-4, area diamond(1) (already correct)
  - mage_ice_bolt: range diamond 1-3, area single (already correct)
  - soldier_rally: range self, area diamond(1) (buff allies around self)
  - cleric_heal: range diamond 0-3, area single (can heal self at range 0)
  - archer_piercing_arrow: range line 2-5, area line(2) (penetrating shot)
  - Add min_range where appropriate (e.g., archer_aimed_shot min_range: 2)

  Ensure at least one skill uses each range pattern type (diamond, line, cross, square, self)
  and at least one uses a non-single area pattern.

definition_of_done:
  - "RangeCalculator computes correct cells for all 5 range pattern types"
  - "AreaCalculator computes correct cells for all 5 area pattern types"
  - "min_range > 0 correctly excludes close cells (hollow range)"
  - "Targeting UI highlights valid range cells when skill is selected"
  - "Targeting UI shows area preview on hover over valid target cell"
  - "Line range shows directional selector and highlights chosen direction only"
  - "Cross range highlights all four directions simultaneously"
  - "Self range auto-targets caster without requiring click"
  - "Line of sight check: Peak terrain blocks targeting through it"
  - "Skill JSONs diversified: at least 1 skill per range type, at least 1 non-single area"
  - "No hardcoded values - all range/area parameters read from JSON"

required_evidence:
