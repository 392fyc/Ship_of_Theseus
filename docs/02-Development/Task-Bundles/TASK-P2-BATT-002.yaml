context:
  problem: |
    TASK-P2-BATT-001 first implementation delivered a functional Action Economy system,
    but the following aspects do not match the human supervisor's expectations:
    1. Skill Panel UI style — visual layout, button presentation, position
    2. Skill display style — icon/text/state indicator format
    3. Action trigger timing — when the panel appears/disappears, interaction flow
    4. Turn flow behavior — resource consumption sequence, turn end conditions, overall rhythm
    These need to be redesigned through a collaborative design session before rework.
  design_source: |
    GDD turn-system.md defines the action resource model and in-turn flow.
    ADR-009 defines implementation architecture decisions.
    Current implementation exists on branch cursor/action-economy with partial merges.
  current_state: |
    - Skill Panel UI exists but style/position/behavior needs revision
    - Action resources (movement_used/standard_used/swift_used) tracked on unit.gd
    - ESC cancel logic fixed (no longer force-ends turn)
    - Camera drag restored, skill panel mouse passthrough fixed
    - 15 skill JSONs have action_cost; timing_constraint being added

design_spec: |
  ## Research Deliverables

  This task produces a design specification document covering 4 areas.
  The output will be used to rework TASK-P2-BATT-001.

  ### Area 1: Skill Panel UI Design
  - Panel layout (vertical list vs grid vs radial)
  - Panel position relative to selected unit
  - Panel show/hide animation and trigger conditions
  - Button visual format (icon + text + cost badge + cooldown overlay)
  - Color scheme for available/unavailable/on-cooldown states
  - Responsive behavior: panel follows unit? fixed position? toggleable?

  ### Area 2: Skill Display Style
  - Skill button anatomy (what information is shown)
  - Action cost iconography (move/standard/swift/reaction/free visual indicators)
  - Cooldown display format (number overlay? progress ring? greyed mask?)
  - Unavailability reason display (tooltip? inline text? icon?)
  - Skill tooltip content and layout

  ### Area 3: Action Trigger Timing
  - When does SkillPanel appear? (on unit select? on dedicated button? always visible?)
  - When does SkillPanel update? (after each action? real-time?)
  - When does SkillPanel hide? (on deselect? on turn end? on targeting mode?)
  - Targeting mode entry/exit flow (click skill -> select target -> confirm/cancel)
  - Normal move vs normal attack vs skill: selection priority and interaction

  ### Area 4: Turn Flow Rhythm
  - Visual feedback for resource consumption (which resource was just spent)
  - Turn phase indicator (whose turn? what phase?)
  - Auto-end turn behavior (when all resources spent? confirm prompt?)
  - Manual end turn (button location, confirmation?)
  - Action undo: can player undo last action before confirming?
  - Turn transition animation/feedback

  ### Output Format
  For each area, produce:
  - ASCII wireframe or layout description
  - State diagram for interactive flows
  - Specific parameter values (sizes, colors, timings)
  - Reference games/examples where applicable

