task_id: "TASK-P2-CRES-001"
title: "Combat Resolution Depth - counter/follow-up fix, terrain combat integration, new maps"
phase_id: "P2"
milestone_refs: ["M11"]
adr_refs: ["ADR-004", "ADR-005"]
owner_agent_type: "dev_sub_agent"
priority: "Sev-0"
status: "verified"
example_artifact: false

design_spec: |
  M11 completes the FE-style attack resolution flow. Existing code has
  a basic counter-attack and follow-up (pursuit) skeleton but with
  several correctness gaps. Terrain combat modifiers exist as hardcoded
  constants in cell.gd and are not wired into the actual combat payload.

  This task fixes all resolution gaps, integrates terrain bonuses into
  the combat pipeline, and adds 2 new maps with varied terrain.

  Reference: 01-Game-Design/Core-Systems/battle-calculation.md
  (Attack Resolution Flow steps 1-8)

