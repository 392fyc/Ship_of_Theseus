definition_of_done:
  - id: "DOD-001"
    desc: "Counter-attack checks disabled state: stunned/frozen units cannot counter"
  - id: "DOD-002"
    desc: "Counter-attack checks defender weapon/skill range, not just adjacency - ranged units can counter at range"
  - id: "DOD-003"
    desc: "Counter-attack uses defender actual weapon data (weapon_might, weapon_hit, damage_type from class data), not hardcoded physical/1.0"
  - id: "DOD-004"
    desc: "Area attacks (allow_counter=false) never trigger counter-attack"
  - id: "DOD-005"
    desc: "Follow-up uses attacker basic attack (normal attack, not skill), full resolution steps 1-6"
  - id: "DOD-006"
    desc: "Follow-up probability = (attacker.SPD - defender.SPD) * 10%, clamped 0-100%, uses effective stats"
  - id: "DOD-007"
    desc: "Follow-up requires original attack hit (no follow-up on miss)"
  - id: "DOD-008"
    desc: "Chain rules enforced: counter does not trigger counter or follow-up; follow-up does not trigger counter or follow-up"
  - id: "DOD-009"
    desc: "Terrain evade bonus wired into combat payload: defender cell evade bonus passed to damage_calculator"
  - id: "DOD-010"
    desc: "Terrain DEF/RES bonus applied to defender effective stats during combat (or passed via action_data)"
  - id: "DOD-011"
    desc: "Terrain bonuses read from JSON (data/terrain/ or map JSON), not hardcoded constants in cell.gd"
  - id: "DOD-012"
    desc: "Combat forecast (preview_attack) includes terrain bonuses in displayed hit/damage values"
  - id: "DOD-013"
    desc: "At least 2 new map JSON files with varied terrain (forest+mountain, mixed with water/lava/swamp)"
  - id: "DOD-014"
    desc: "Full resolution order correct: hit -> block(future) -> crit -> damage -> on_hit effects -> after_damage -> counter(1-6) -> follow-up(1-6)"
  - id: "DOD-015"
    desc: "No hardcoded combat values - all from JSON or formula constants in design docs"

required_evidence:
  - "Code references showing counter disabled-state check"
  - "Code references showing counter range check beyond adjacency"
  - "Code references showing terrain bonus pipeline from cell to damage_calculator"
  - "Terrain JSON files or terrain data in map JSON"
  - "2+ new map JSON files with varied terrain"
  - "Console log or runtime proof of counter/follow-up triggering correctly"

