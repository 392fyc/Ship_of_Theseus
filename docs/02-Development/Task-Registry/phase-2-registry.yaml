# ==========================================================================
# 归档抬头（2026-08-03 追加）
# 本文件已整份归档。下面的 archive 段落是本轮新增的内容，头部的 phase_status
# 已同步改为 closed；其余字段一律保持 2026-05-10 的原样，没有改写、没有删除——
# 它作为历史记录依然有效，失效的只是「它描述的是当前状态」这个前提。
# ==========================================================================
archive:
  status: archived
  archived_at: "2026-08-03"
  summary: "P2 任务注册表停更于 2026-05-10，不再跟踪现实进度。保留为历史记录，不再作为状态真源。"
  reason:
    - "停更：头部的 last_updated 与本文件最后一次提交都停在 2026-05-10。此后近三个月的实际工作（剑圣资源引擎、run-loop v0 门循环、词条系统）一条都没有进入本注册表；反过来 next_queue 仍写着「M12 unblocked, ready to start」，而 M12 的波次与敌人其实已经在 run-loop v0 里先落地了。"
    - "展示链已断：本文件唯一的自动消费者是首页 Dashboard 脚本，而该脚本在读注册表之前先读 authoritative_files.session_ledger 指向的 03-AI-Context/Active-Context/current-session.md，该文件已不存在，展示链本身是断的。"
    - "流程已废止：头部的 bundle_policy 强制要求 Task Bundle 与 Acceptance Bundle，而用户已于 2026-06-16 裁决弃用 Task Bundle / implementation_receipt 流程。"
  superseded_items:
    - milestone: M9
      field: deliverables
      item: "Line of sight: Peak terrain blocks attack line"
      verdict: invalidated
      reason: "R4.3 现行条文明写「攻击线不受地形阻挡」，引擎侧也已改为地形不再阻挡任何攻击线，PEAK 仅保留移动不可通行。"
    - milestone: M10
      field: deliverables
      item: "Resistance formula: actual_chance = skill_effect.chance * (1 - defender.resistance / 100)"
      verdict: superseded
      reason: "与现行规则不一致。R1.5 现行公式是 skill.chance × max(0.1, 1 − target.LCK/100)，按目标的 LCK 折算并带 0.1 下限；注册表这条按 defender.resistance 折算且没有下限。引擎实装跟的是 R1.5。"
    - milestone: M11
      field: deliverables
      item: "Counter-attack: attack_type != area AND target alive AND not disabled AND in range -> normal attack"
      verdict: invalidated
      reason: "自动反击已于 2026-07-11 整体移除，触发条件本身不再存在。"
    - milestone: M11
      field: deliverables
      item: "Follow-up: (attacker.speed - defender.speed) * 10% probability, requires original hit"
      verdict: invalidated
      reason: "追击系统已于 2026-07-12 移除，速度差换算概率的规则不再存在。"
    - milestone: M11
      field: deliverables
      item: "Chain rules: counter does not trigger follow-up/counter, follow-up does not trigger counter/follow-up"
      verdict: invalidated
      reason: "封链规则的两个对象（反击与追击）都已移除，规则随之失去适用对象。"
    - milestone: M11
      field: deliverables
      item: "Full resolution order: hit->crit->damage->on_hit effects->after_damage effects->counter(1-6)->follow-up(1-6)"
      verdict: partially_invalidated
      reason: "结算顺序里的 counter 段与 follow-up 段已随两个系统移除而失效；前面的命中→暴击→伤害→on_hit 效果→after_damage 效果一段仍然成立。"
    - milestone: M11
      field: acceptance_criteria
      item: "Melee attack triggers counter if target alive, not stunned, in range"
      verdict: invalidated
      reason: "自动反击已于 2026-07-11 移除。"
    - milestone: M11
      field: acceptance_criteria
      item: "Follow-up probability correct: speed diff 5 = 50%"
      verdict: invalidated
      reason: "追击系统已于 2026-07-12 移除。"
    - milestone: M11
      field: acceptance_criteria
      item: "Area attack does not trigger counter"
      verdict: invalidated
      reason: "自动反击已于 2026-07-11 移除，不存在需要排除范围攻击的触发判定。"
  still_valid:
    - milestone: M11
      field: deliverables
      item: "Terrain combat modifiers: evasion/defense bonuses read from terrain JSON"
      note: "仍成立。引擎侧确实在读数据文件，森林闪避加成、山地 DEF/RES 加成都写在 data/terrain/terrain_combat.json 里。"
    - milestone: M11
      field: deliverables
      item: "2-3 new maps with varied terrain compositions"
      note: "仍成立。已有三张新图。"
    - milestone: M11
      field: acceptance_criteria
      item: "Forest terrain evasion bonus read from JSON, not hardcoded"
      note: "仍成立。"
  m12_not_blocked: |
    M12 的 depends_on 只写了 M11，但 M12 自己的六条交付项没有任何一条踩在反击或追击上，
    只吃 M11 的地形部分与结算完整性——所以上面 M11 那四条失效不阻塞 M12。
    依赖关系本轮不改，这里写明只是为了避免后来的读者误以为 M12 被卡住。
  scope_of_this_change: |
    本轮追加这段抬头，没有逐条改写里程碑内容，也没有删除任何内容。
    头部的 phase_status 已同步改为 closed；last_updated / next_queue / bundle_policy 冻结在 2026-05-10 的状态，
    阅读时一律按历史记录看待，不要当成当前状态。
