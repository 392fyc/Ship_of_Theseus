issue_id: "ISSUE-2026-03-09-001"
title: "Godot MCP single-client lock blocks multi-agent workflows"
status: "drafted"
example_artifact: false

source:
  reporter_type: "dev_agent"
  reporter_id: "codex"
  detected_at: "2026-03-09"

type: "tooling"
priority: "Sev-0"
impact_scope:
  code: false
  kb: false
  workflow: true
  environment: true

description:
  summary: "Godot MCP server accepts only one WebSocket client at a time. When an implementation agent holds the connection, a second agent (e.g. acceptance agent) receives 'another client already connected' and cannot attach. This blocks any workflow requiring agent handoff without manual MCP restart."
  details:
    - "Observed during ACC-P1-SKILL-002 blind acceptance: acceptance agent could not connect to Godot MCP because implementation agent session had not fully released the socket."
    - "Current workaround requires human intervention to stop previous agent session, restart Godot editor, or manually disconnect."
    - "As the project moves into multi-task and multi-agent execution, this will be a recurring friction point for every implementation-to-acceptance handoff."
    - "The MCP addon in Godot editor binds to localhost with a single-client WebSocket listener."
  evidence:
    - "Acceptance agent reported 'another client already connected' when attempting MCP connection during ACC-P1-SKILL-002 execution."

decision: "interrupt_now"
linked_task_ids:
  - "TASK-P1-SKILL-002"
linked_acceptance_ids:
  - "ACC-P1-SKILL-002"
trigger_condition: "created_from_runtime_detection"
resolution_status: "resolved"
resolved_by: "TASK-P1-TOOL-001"
resolved_at: "2026-03-10"
owner: "main_agent"

proposed_solutions:
  - id: "SOL-A"
    title: "Modify MCP addon to support multiple simultaneous clients"
    description: "Patch the Godot MCP addon WebSocket server to accept multiple concurrent connections with session isolation."
    feasibility: "requires addon source modification"
    risk: "message routing complexity; potential state conflicts between clients"
  - id: "SOL-B"
    title: "Spawn separate MCP listener per port"
    description: "Configure the addon to listen on multiple ports (e.g. 6005 for dev agent, 6006 for acceptance agent) with the same backend."
    feasibility: "addon config or fork required"
    risk: "port management overhead; still single-editor bottleneck"
  - id: "SOL-C"
    title: "Enforce sequential agent access with graceful disconnect protocol"
    description: "Keep single-client model but add a disconnect handshake. Before dispatching acceptance agent, ensure implementation agent explicitly disconnects and MCP confirms readiness."
    feasibility: "process-level solution, no addon change"
    risk: "still requires manual coordination; does not scale to parallel agents"
