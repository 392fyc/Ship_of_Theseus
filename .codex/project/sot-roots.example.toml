# Copy to ignored sot-roots.local.toml and fill absolute local paths.
# Use forward slashes in double quoted paths (or TOML single quoted literal paths).
[roots]
ship_root = "<path-to-game-main-checkout>"
designlib_root = "<path-to-design-library>"
# Optional active-memory root; defaults to the game's primary Git worktree/.sot/memory.
memory_root = "<path-to-active-memory>"

# Task trees live inside each repository at <repository root>/.worktrees (git-ignored there).
[worktrees]
ship_root = "<path-to-game-main-checkout>/.worktrees"
designlib_root = "<path-to-design-library>/.worktrees"
