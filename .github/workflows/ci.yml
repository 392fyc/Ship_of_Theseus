# Register workflow_dispatch on the default branch. Dispatches to task branches
# use that branch's complete CI workflow; dispatching main tests develop.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-validation:
    name: Default-branch workflow configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate proposed workflow configuration and publication boundaries
        run: |
          python -m pip install PyYAML==6.0.3
          python -B - <<'PY'
          from pathlib import Path
          import shlex
          import yaml
          workflows = {p.name: yaml.load(p.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
                       for p in Path('.github/workflows').glob('*.yml')}
          assert all(isinstance(w, dict) and isinstance(w.get('jobs'), dict) for w in workflows.values())
          # The Mercury v1 sync workflow is retired; the Mercury v2 update workflow (managed by Mercury) replaces it.
          assert 'mercury-sync.yml' not in workflows
          update = workflows['mercury-update.yml']
          assert set(update['on']) == {'schedule', 'workflow_dispatch'}
          assert update['permissions'] == {'contents': 'read'}
          # On this default branch a scheduled run only starts the same workflow on the integration branch.
          dispatch = update['jobs']['dispatch']
          assert dispatch['permissions'] == {'actions': 'write'}
          assert dispatch['env']['MERCURY_BASE'] == 'develop'
          assert "github.ref_name != 'develop'" in dispatch['if']
          command = shlex.split(dispatch['steps'][-1]['run'])
          assert command[:4] == ['gh', 'workflow', 'run', 'mercury-update.yml']
          assert command[command.index('--ref') + 1] == '$MERCURY_BASE'
          assert 'secrets.' not in str(dispatch) and 'create-github-app-token' not in str(dispatch)
          # The update job reads Mercury from its released master and writes only the integration branch.
          job = update['jobs']['update']
          assert set(update['jobs']) == {'dispatch', 'update'}
          assert len(dispatch['steps']) == 1
          assert 'permissions' not in job  # the workflow token stays read-only; writes use the narrowed App token
          app = [s for s in job['steps'] if s.get('uses', '').startswith('actions/create-github-app-token@')]
          assert len(app) == 1
          assert {k: v for k, v in app[0]['with'].items() if k.startswith('permission-')} == {
              'permission-contents': 'write', 'permission-pull-requests': 'write',
              'permission-workflows': 'write', 'permission-checks': 'read', 'permission-statuses': 'read'}
          assert job['env']['MERCURY_BASE'] == 'develop'
          source = [s for s in job['steps'] if s.get('with', {}).get('repository') == '392fyc/Mercury']
          assert len(source) == 1 and source[0]['with']['ref'] == 'master'
          assert source[0]['with']['persist-credentials'] == 'false'
          target = [s for s in job['steps'] if s.get('with', {}).get('path') == 'target']
          assert len(target) == 1 and target[0]['with']['ref'] == 'develop'
          print('Workflow configuration and publication boundaries passed')
          PY
  integration-ci:
    name: Existing develop integration regression
    uses: 392fyc/Ship_of_Theseus/.github/workflows/ci.yml@develop
    with:
      test_ref: develop
