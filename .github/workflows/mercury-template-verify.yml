name: Mercury Template Verification

on:
  pull_request:
    branches: [develop]
    paths:
      - '.codex/**'
      - '.github/workflows/mercury-sync.yml'
      - '.github/workflows/mercury-template-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Mercury template provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: target
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: 392fyc/Mercury
          ref: develop
          path: mercury
          fetch-depth: 0
          persist-credentials: false
      - name: Verify upstream provenance and exact generated bytes
        run: python -B mercury/scripts/codex/verify-project-template.py --target target
