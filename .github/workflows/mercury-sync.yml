name: Mercury Harness Sync

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercury-sync-publisher
  cancel-in-progress: false

jobs:
  update:
    name: Publish and reconcile template updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          path: target
          fetch-depth: 0
          token: ${{ secrets.MERCURY_SYNC_TOKEN || github.token }}
      - uses: actions/checkout@v7
        with:
          repository: 392fyc/Mercury
          ref: develop
          path: mercury
          fetch-depth: 0
          persist-credentials: false
      - name: Update only Mercury manifest paths
        env:
          GH_TOKEN: ${{ secrets.MERCURY_SYNC_TOKEN || github.token }}
        run: >-
          python -B mercury/scripts/codex/sync-downstream-pr.py
          --target target --repo 392fyc/Ship_of_Theseus --base develop
          --issue 43 --reviewer 'argus-review[bot]' --publish-only
