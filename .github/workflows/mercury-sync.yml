name: Mercury Harness Sync

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.codex/**'
      - '.github/workflows/mercury-sync.yml'

permissions:
  contents: read

concurrency:
  group: mercury-sync-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publisher' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    name: Mercury template verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: target
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: 392fyc/Mercury
          ref: develop
          path: mercury
          fetch-depth: 0
          persist-credentials: false
      - name: Verify upstream provenance and exact generated bytes
        run: python -B mercury/scripts/codex/verify-project-template.py --target target

  update:
    if: github.event_name != 'pull_request'
    name: Publish and reconcile template updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          path: target
          fetch-depth: 0
          token: ${{ secrets.MERCURY_SYNC_TOKEN || github.token }}
      - uses: actions/checkout@v7
        with:
          repository: 392fyc/Mercury
          ref: develop
          path: mercury
          fetch-depth: 0
          persist-credentials: false
      - name: Update only Mercury manifest paths
        env:
          GH_TOKEN: ${{ secrets.MERCURY_SYNC_TOKEN || github.token }}
        run: >-
          python -B mercury/scripts/codex/sync-downstream-pr.py
          --target target --repo 392fyc/Ship_of_Theseus --base develop
          --issue 43 --reviewer argus-review
