name: Action cost cloud capture
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/action-cost-capture.yml'
      - 'scripts/art/character_pipeline/capture_action_cost_clarity.gd'
      - 'scripts/ui/hud/m2/**'
      - 'scenes/tactical/hud/m2/**'
      - 'tests/test_hud_m2_*'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install the established cloud rendering runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-wqy-microhei xvfb xauth ffmpeg python3-pil >/dev/null
          mkdir -p .tmp/action-cost-capture/runtime
          curl -fsSL -o .tmp/action-cost-capture/runtime/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  .tmp/action-cost-capture/runtime/godot.zip' | sha256sum -c -
          unzip -q .tmp/action-cost-capture/runtime/godot.zip -d .tmp/action-cost-capture/runtime
          chmod +x .tmp/action-cost-capture/runtime/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT=$GITHUB_WORKSPACE/.tmp/action-cost-capture/runtime/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          git rev-parse HEAD > .tmp/action-cost-capture/candidate-head.txt
      - name: Run the relevant regressions
        env:
          LOG_DIR: .tmp/action-cost-capture/test-logs
        run: |
          set -o pipefail
          bash tools/ci/run_godot_tests.sh hud_m2 action_resource portrait_battle_ui portrait_token_forecast | tee .tmp/action-cost-capture/tests.log
      - name: Capture the real battle and the explicit resource boundary case
        run: |
          for scenario in normal threshold; do
            frames=780
            if [ "$scenario" = threshold ]; then frames=420; fi
            mkdir -p ".tmp/action-cost-capture/$scenario"
            timeout --kill-after=10s 360s xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' "$GODOT" --path . --rendering-method gl_compatibility --audio-driver Dummy --display-driver x11 --resolution 1280x720 --fixed-fps 30 --disable-vsync --script res://scripts/art/character_pipeline/capture_action_cost_clarity.gd -- --out="$GITHUB_WORKSPACE/.tmp/action-cost-capture/$scenario" --frames="$frames" --case="$scenario" > ".tmp/action-cost-capture/$scenario/battle.log" 2>&1
            if grep -E 'SCRIPT ERROR|Parse Error|UI06_CHECK_FAILED' ".tmp/action-cost-capture/$scenario/battle.log"; then exit 1; fi
            ffmpeg -v error -framerate 30 -i ".tmp/action-cost-capture/$scenario/frames/frame_%05d.png" -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart ".tmp/action-cost-capture/$scenario/battle.mp4"
          done
          git diff -- project.godot > .tmp/action-cost-capture/engine-import.diff
          git show HEAD:project.godot > project.godot
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, shutil
          out=Path('.tmp/action-cost-capture')
          picks={
            'normal':['move_available','qi_insufficient','move_spent','swift_spent','standard_cost','strike_targeting','standard_spent','mark_requirement'],
            'threshold':['marks_below_card','qi_below_card','badao_cost','guard_restored']}
          for name, markers in picks.items():
              folder=out/name
              trace=json.loads((folder/'action-cost-trace.json').read_text())
              assert trace['flow_complete'] and trace['size']==[1280,720] and trace['fps']==30
              assert len(trace['states'])==trace['frames']
              assert all(c['ok'] for c in trace['checks']), trace['checks']
              assert bool(trace['fixture_resource_changes'])==(name=='threshold')
              events={e['event']:e for e in trace['events']}
              frames={marker:events[marker]['frame']+3 for marker in markers}
              for marker, frame in frames.items():
                  shutil.copyfile(folder/'frames'/f'frame_{frame:05d}.png',folder/f'{marker}.png')
              (folder/'keyframes.json').write_text(json.dumps(frames,indent=2)+'\n')
          files=[p for p in out.rglob('*') if p.is_file() and 'frames' not in p.parts and 'runtime' not in p.parts]
          (out/'media-manifest.json').write_text(json.dumps([{'name':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: action-cost-capture
          retention-days: 7
          path: |
            .tmp/action-cost-capture/*.txt
            .tmp/action-cost-capture/*.log
            .tmp/action-cost-capture/*.diff
            .tmp/action-cost-capture/*.json
            .tmp/action-cost-capture/normal/*.log
            .tmp/action-cost-capture/normal/*.json
            .tmp/action-cost-capture/normal/*.png
            .tmp/action-cost-capture/normal/*.mp4
            .tmp/action-cost-capture/threshold/*.log
            .tmp/action-cost-capture/threshold/*.json
            .tmp/action-cost-capture/threshold/*.png
            .tmp/action-cost-capture/threshold/*.mp4
            .tmp/action-cost-capture/test-logs/
